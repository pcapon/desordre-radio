# =============================================================================
# Désordre Radio — website stack
# =============================================================================
#   caddy     : reverse proxy + automatic TLS (the only HTTP entrypoint)
#   strapi    : editorial CMS (shows, episodes, articles) — SQLite + local uploads
#   frontend  : TanStack Start SSR (Nitro node-server) with the docked player
#
# The radio itself (autoDJ, scheduling, live DJs, stream, now-playing) is
# AzuraCast, installed separately on the same host with its official installer
# on HTTP port 8080 — see README.md. Caddy proxies RADIO_DOMAIN to it.
# Copy .env.example → .env and fill the secrets before `docker compose up`.
# =============================================================================

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend, strapi]
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      CMS_DOMAIN: ${CMS_DOMAIN:-cms.localhost}
      RADIO_DOMAIN: ${RADIO_DOMAIN:-radio.localhost}
      AZURACAST_UPSTREAM: ${AZURACAST_UPSTREAM:-host.docker.internal:8080}
    ports:
      - '80:80'
      - '443:443'
    # Lets Caddy reach AzuraCast, which runs in its own compose project on the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  strapi:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://${CMS_DOMAIN:-cms.localhost}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: data/strapi.db
    volumes:
      - strapi_data:/app/data
      - strapi_uploads:/app/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://localhost:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      # Vite inlines VITE_* at build time → pass the public URLs as build args.
      args:
        VITE_STRAPI_URL: https://${CMS_DOMAIN:-cms.localhost}
        VITE_AZURACAST_URL: https://${RADIO_DOMAIN:-radio.localhost}
        VITE_AZURACAST_STATION: ${AZURACAST_STATION:-desordre_radio}
    restart: unless-stopped
    depends_on: [strapi]
    environment:
      PORT: 3000

volumes:
  strapi_data:
  strapi_uploads:
  caddy_data:
  caddy_config:
