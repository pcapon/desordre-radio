# Local development: only Strapi, in develop mode, on localhost:1337.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up strapi
# Run the frontend with `pnpm dev` (see frontend/.env.local).
services:
  caddy:
    profiles: ['prod']

  frontend:
    profiles: ['prod']

  strapi:
    environment:
      NODE_ENV: development
      PUBLIC_URL: http://localhost:1337
    command: npm run develop
    ports:
      - '1337:1337'
    volumes:
      - ./backend:/app
      - strapi_node_modules:/app/node_modules
      - strapi_data:/app/data

volumes:
  strapi_node_modules:
